name: Node.js Backend CI/CD

on:
  push:
    paths:
      - 'server/**'
    branches:
      - prod
      - dev

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Create .env.server file
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env.server
          echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" >> .env.server
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env.server
          echo "R2_BUCKET_NAME_VIDEOS=${{ secrets.R2_BUCKET_NAME_VIDEOS }}" >> .env.server
          echo "R2_BUCKET_NAME_AVATARS=${{ secrets.R2_BUCKET_NAME_AVATARS }}" >> .env.server
          echo "R2_BUCKET_NAME_THUMBNAILS=${{ secrets.R2_BUCKET_NAME_THUMBNAILS }}" >> .env.server
          echo "R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }}" >> .env.server
          echo "R2_ENDPOINT=${{ secrets.R2_ENDPOINT }}" >> .env.server
          echo "R2_PUBLIC_DOMAIN_AVATAR=${{ secrets.R2_PUBLIC_DOMAIN_AVATAR }}" >> .env.server
          echo "R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}" >> .env.server
          echo "R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}" >> .env.server
          echo "GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}" >> .env.server
          echo "REDIS_URL"=${{ secrets.REDIS_URL }} >> .env.server
          echo "R2_BASE_URL=${{ secrets.R2_BASE_URL }}" >> .env.server

      - name: Install dependencies
        run: npm install

      - name: Trigger Render Deployment
        run: curl "$RENDER_DEPLOY_HOOK_URL"
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
