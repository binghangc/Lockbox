<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vault Stats Card</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Arial', sans-serif;
      }
      body {
        background: url('moonlight-fallback.png') no-repeat center center;
        background-size: cover;
        padding: 40px;
        color: white;
      }
      .card {
        background: rgba(0, 0, 0, 0.6);
        border-radius: 16px;
        padding: 32px;
        width: 700px;
        margin: 0 auto;
      }
      h1,
      h2 {
        text-align: center;
        margin-bottom: 12px;
      }
      .emoji-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        justify-content: center;
        margin-bottom: 24px;
      }
      .emoji-item {
        text-align: center;
        width: 80px;
      }
      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
        margin-bottom: 24px;
      }
      .tag {
        background: rgba(255, 255, 255, 0.2);
        padding: 6px 12px;
        border-radius: 9999px;
      }
      .vibe-card {
        background: rgba(255, 255, 255, 0.1);
        padding: 16px;
        border-radius: 12px;
        margin-bottom: 12px;
      }
    </style>
  </head>
  <body>
    <div id="root" class="card">
      <h1 id="trip-archetype">Trip Archetype</h1>
      <h2>Your overall vibe this trip</h2>

      <h2>Top Themes</h2>
      <div id="themes" class="emoji-grid"></div>

      <h2>Top Activities</h2>
      <div id="activities" class="tags"></div>

      <h2>Top Locations</h2>
      <div id="locations" class="tags"></div>

      <h2>Top Keywords</h2>
      <div id="keywords" class="tags"></div>

      <h2>Highlight Day</h2>
      <div id="highlight"></div>

      <h2>Vibe Clusters</h2>
      <div id="clusters"></div>
    </div>

    <script>
      const THEME_CONFIG = {
        funny: { emoji: '🤣', label: 'Funny', description: 'Moments that made you burst out laughing.' },
        emotional: { emoji: '🥺', label: 'Emotional', description: 'Heartfelt or tearjerking vibes.' },
        nostalgic: { emoji: '📼', label: 'Nostalgic', description: 'Throwbacks and memories.' },
        reflective: { emoji: '🪞', label: 'Reflective', description: 'Deep thoughts, introspection, and growth.' },
        aesthetic: { emoji: '🎨', label: 'Aesthetic', description: 'Visual perfection and vibes.' },
        chaotic: { emoji: '🎢', label: 'Chaotic', description: 'Unpredictable and high-energy moments.' },
        vulnerable: { emoji: '🫶', label: 'Vulnerable', description: 'Open, honest, and real.' },
        romantic: { emoji: '💘', label: 'Romantic', description: 'Sweet dates, flirty energy, and love in the air.' },
        unfiltered: { emoji: '📸', label: 'Unfiltered', description: 'Raw and candid takes.' },
        wholesome: { emoji: '🧸', label: 'Wholesome', description: 'Soft, gentle, and feel-good content.' },
        yums: { emoji: '🍜', label: 'Yums', description: 'Delicious eats and foodie finds.' },
      };

      const VIBE_CLUSTER_CONFIG = {
        'Dreamy Chill': {
          emoji: '🌙✨',
          tagline: 'Laid-back vibes and stargazing feels.',
          glowColor: '#60a5fa'
        },
        'Chaotic Fun': {
          emoji: '🎉🔥',
          tagline: 'Unhinged energy. You lived a little.',
          glowColor: '#fb7185'
        },
        'Reflective Quiet': {
          emoji: '🪞🌲',
          tagline: 'Deep thoughts and tranquil moments.',
          glowColor: '#818cf8'
        },
        'Romantic Escape': {
          emoji: '💘🌅',
          tagline: 'A trip straight out of a love song.',
          glowColor: '#f472b6'
        },
        'Adventure Rush': {
          emoji: '🏔️⚡',
          tagline: 'Action-packed and adrenaline-fueled.',
          glowColor: '#eab308'
        },
      };

      const BACKGROUND_IMAGES = {
        moonlight: '../assets/videos/fallback/moonlightStatic.png',
        grass: '../../assets/videos/fallback/grassStatic.png',
        rainbow: '../../assets/videos/fallback/rainbowStatic.png',
        pool: '../../assets/videos/fallback/poolStatic.png',
        ski: '../../assets/videos/fallback/skiStatic.png'
      };


      window.renderStats = function (stats, trips) {
        const bgKey = stats.video_background || 'moonlight';
        const bgPath = BACKGROUND_IMAGES[bgKey] || BACKGROUND_IMAGES['moonlight'];
        document.body.style.backgroundImage = `url('${bgPath}')`;

        document.getElementById('trip-archetype').textContent = stats.trip_archetype;

        const themesEl = document.getElementById('themes');
        Object.entries(stats.theme_distribution)
          .sort((a, b) => b[1] - a[1])
          .forEach(([theme, count]) => {
            const { emoji, label } = THEME_CONFIG[theme] || {};
            if (!emoji) return;
            const div = document.createElement('div');
            div.className = 'emoji-item';
            div.innerHTML = `<div style="font-size: 2rem">${emoji}</div><div>${label}<br/>${count}</div>`;
            themesEl.appendChild(div);
          });

        const fillTags = (id, arr) => {
          const el = document.getElementById(id);
          arr.forEach((tag) => {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = tag;
            el.appendChild(span);
          });
        };
        fillTags('activities', stats.top_activity_tags);
        fillTags('locations', stats.top_location_tags);
        fillTags('keywords', stats.top_keywords);

        const highlight = document.getElementById('highlight');
        if (stats.highlight_day) {
          highlight.textContent = `${stats.highlight_day.date}: "${stats.highlight_day.vibe}" — ${stats.highlight_day.orb_count} orb${stats.highlight_day.orb_count !== 1 ? 's' : ''}`;
        }

        const clustersEl = document.getElementById('clusters');
        Object.keys(stats.vibe_clusters).forEach((name) => {
          const config = VIBE_CLUSTER_CONFIG[name] || {
            emoji: '🌀',
            tagline: 'Undefined vibes',
            glowColor: '#aaa'
          };
          const div = document.createElement('div');
          div.className = 'vibe-card';
          div.innerHTML = `<strong>${config.emoji} ${name}</strong><br/><em>${config.tagline}</em>`;
          clustersEl.appendChild(div);
        });
      };
    </script>
  </body>
</html>
